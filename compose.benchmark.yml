x-benchmark-backend: &benchmark-backend
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: test
  environment:
    APP_SECRET_KEY: benchmark-only-secret-value
    AUTH_ENABLED: "false"
    # Only the worker workload enables automation; other benchmarks drive stages directly.
    AUTOMATION_ENABLED: ${BENCHMARK_AUTOMATION:-false}
    INVESTIGATOR_PROVIDER_MODE: offline
    ALERT_UNDERSTANDING_PROVIDER_MODE: offline
    DATABASE_URL: postgresql+asyncpg://benchmark:benchmark@postgres:5432/benchmark
    AI_TRIAGE_PROVIDER_MODE: offline
    THREAT_INTEL_PROVIDER_MODE: offline
    THREAT_INTEL_ENABLE_EXTERNAL_PROVIDERS: "false"
    WAZUH_ACTIVE_RESPONSE_PROVIDER_MODE: offline
    KNOWLEDGE_BASE_PROVIDER_MODE: offline
    SECURITY_RATE_LIMIT_PER_MINUTE: "100000"
    CORS_ALLOWED_ORIGINS: http://localhost:8000
  depends_on:
    postgres:
      condition: service_healthy

services:
  migrate:
    <<: *benchmark-backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    <<: *benchmark-backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./:/workspace:ro
      - ./knowledge:/app/knowledge:ro
      - ./.benchmark-runs:/results
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    <<: *benchmark-backend
    command: ["python", "-m", "app.workers.soc"]
    profiles: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./knowledge:/app/knowledge:ro

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
      POSTGRES_DB: benchmark
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d benchmark"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
