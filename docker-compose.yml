services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      # Copy .env.example to .env and set a non-default APP_SECRET_KEY.
      - ${ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: soc
      POSTGRES_DB: soc
    # Keep PostgreSQL on the private Compose network. Only the backend needs it.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Reserved for the queue worker in a later phase; not exposed externally.
    expose:
      - "6379"

volumes:
  postgres_data:
